<section class="page-header">
  <div>
    <span class="eyebrow">Solicitacoes</span>
    <h1>Nova solicitacao de compra</h1>
  </div>
  <a routerLink="/app/solicitacoes">Voltar</a>
</section>

<section class="form-card">
  <div *ngIf="loadingRefs()" class="state">Carregando cadastros...</div>
  <div *ngIf="error()" class="state error">{{ error() }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!loadingRefs()">
    <label>
      <span>Tipo</span>
      <select formControlName="type">
        <option *ngFor="let option of availableTypeOptions()" [ngValue]="option.value">
          {{ option.label }}
        </option>
      </select>
    </label>

    <label>
      <span>Obra</span>
      <select formControlName="workId">
        <option value="">Selecione</option>
        <option *ngFor="let work of works()" [value]="work.id">
          {{ work.code }} - {{ work.name }}
        </option>
      </select>
    </label>

    <ng-container *ngIf="form.controls.type.value === PurchaseRequestType.Material">
      <label>
        <span>Descricao</span>
        <textarea
          formControlName="description"
          rows="4"
          placeholder="Material necessario para concretagem da fundacao..."></textarea>
      </label>

      <section class="material-box">
        <div class="section-title">
          <h2>Itens</h2>
          <a routerLink="/app/cadastros" [queryParams]="{ tab: 'materials' }">Material nao encontrado? Cadastrar material</a>
        </div>

        <div class="item-form" [formGroup]="materialItemForm">
          <label>
            <span>Quantidade</span>
            <input type="number" min="1" step="1" formControlName="quantity">
          </label>

          <label>
            <span>Material</span>
            <select formControlName="itemId">
              <option value="">Selecione</option>
              <option *ngFor="let item of activeCatalogItems()" [value]="item.id">
                {{ item.description }}
              </option>
            </select>
          </label>

          <button type="button" class="secondary-action" (click)="addMaterialItem()">+ Adicionar item</button>
        </div>

        <div class="draft-list" *ngIf="materialDraftItems().length > 0; else emptyDraft">
          <article class="draft-item" *ngFor="let item of materialDraftItems(); let i = index">
            <strong>{{ item.quantity }} {{ item.unit }} - {{ item.description }}</strong>
            <button type="button" class="danger-action" (click)="removeMaterialItem(i)">Remover</button>
          </article>
        </div>

        <ng-template #emptyDraft>
          <div class="state compact">Nenhum item adicionado.</div>
        </ng-template>
      </section>
    </ng-container>

    <ng-container *ngIf="form.controls.type.value === PurchaseRequestType.Service">
      <label>
        <span>Servico</span>
        <textarea formControlName="serviceDescription" rows="3"></textarea>
      </label>

      <label>
        <span>Especificacao do servico</span>
        <textarea formControlName="serviceSpecification" rows="4"></textarea>
      </label>

      <div class="form-grid">
        <label>
          <span>Quantidade prevista</span>
          <input type="number" min="0.0001" step="0.0001" formControlName="serviceQuantity">
        </label>

        <label>
          <span>Unidade de medicao</span>
          <input type="text" formControlName="serviceUnit" placeholder="m2, hora, dia, etapa">
        </label>
      </div>
    </ng-container>

    <button type="submit" [disabled]="form.invalid || saving()">
      {{ saving() ? 'Salvando...' : (form.controls.type.value === PurchaseRequestType.Material ? 'Solicitar Material' : 'Criar solicitacao') }}
    </button>
  </form>
</section>
