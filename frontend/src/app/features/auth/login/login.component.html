<main class="login-page">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="brand-row">
      <span class="brand-mark">SGE</span>
      <span class="brand-text">ERP</span>
    </div>

    <h1 id="login-title">Entrar no SGE-ERP</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>Email</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="admin@sge.local">
      </label>
      <p class="field-error" *ngIf="hasFieldError('email')">Informe um email valido.</p>

      <label class="field">
        <span>Senha</span>
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password">
          <button type="button" (click)="togglePassword()">
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </label>
      <p class="field-error" *ngIf="hasFieldError('password')">Informe a senha.</p>

      <div class="login-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button class="submit-button" type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </section>
</main>
